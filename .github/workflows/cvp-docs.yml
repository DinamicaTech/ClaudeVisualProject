name: CVP docs
# Keeps docs/.index.md (the node index) and the CVP rules block of docs/global-rules.md up to date on
# the default branch, with this repository's own tools: on every push to it and on demand.
# Projects install tools/project/cvp-docs.yml instead, which downloads the tools from this repository.
# Its own commits do not trigger workflows (GITHUB_TOKEN).
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cvp-docs
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the node index and the CVP rules
        run: |
          node tools/update-rules.mjs docs --auto
          node tools/build-index.mjs docs
      - name: Commit them to the default branch
        run: |
          git add docs/.index.md docs/global-rules.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "CVP docs: update the node index and the CVP rules"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.event.repository.default_branch }} && exit 0
            git pull --rebase origin ${{ github.event.repository.default_branch }}
          done
          exit 1
