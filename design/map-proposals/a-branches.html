<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map Proposal A: Branches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: the validated left-to-right tree, redrawn as cards. Each top-level area owns a hue that flows
     through its connectors; dependencies become chips inside the card instead of repeated boxes. */
  :root {
    --bg: #f3f4f1; --panel: #ffffff; --fg: #1d2126; --muted: #69707a; --line: #dfe1dc; --canvas-dot: #d9dcd5;
    --dep: #2f7d62; --dependent: #b4661d; --sel: #1d2126;
    --b0: #3d63c9; --b1: #8a4fbf; --b2: #c2513f; --b3: #2f8a73; --b4: #b8861b; --b5: #3a8bb0; --b6: #b1477d; --b7: #6b7d2a;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1e2125; --fg: #e7e8e5; --muted: #99a0a8; --line: #30343a; --canvas-dot: #2a2e33;
    --dep: #6cc7a3; --dependent: #e9a35e; --sel: #e7e8e5;
    --b0: #86a3ff; --b1: #c39af0; --b2: #f08f7c; --b3: #6cc7aa; --b4: #e6bd5c; --b5: #79c3e4; --b6: #ec8fbd; --b7: #b4c46a;
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #15171a; --panel: #1e2125; --fg: #e7e8e5; --muted: #99a0a8; --line: #30343a; --canvas-dot: #2a2e33;
    --dep: #6cc7a3; --dependent: #e9a35e; --sel: #e7e8e5;
    --b0: #86a3ff; --b1: #c39af0; --b2: #f08f7c; --b3: #6cc7aa; --b4: #e6bd5c; --b5: #79c3e4; --b6: #ec8fbd; --b7: #b4c46a;
    color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; }
  button, select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--muted); }
  :focus-visible { outline: 2px solid var(--b0); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header h1 span { color: var(--muted); font-weight: 400; }
  header nav { display: flex; gap: 4px; font-size: 13px; }
  header nav a { color: var(--muted); text-decoration: none; padding: 3px 8px; border-radius: 5px; }
  header nav a[aria-current] { background: var(--fg); color: var(--panel); }
  header .sp { flex: 1; }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; overflow: auto; min-width: 0;
    background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px); background-size: 18px 18px; }
  #canvas { position: relative; }
  #canvas svg { position: absolute; inset: 0; overflow: visible; }
  .zoom { position: sticky; top: 10px; left: 10px; z-index: 2; display: inline-flex; gap: 4px; margin: 10px; }
  .zoom button { padding: 2px 9px; }

  .link { fill: none; stroke-linecap: round; opacity: .55; transition: opacity .15s, stroke-width .15s; }
  .link.on { opacity: 1; }

  .card { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 9px 15px;
    cursor: pointer; overflow: hidden; transition: box-shadow .15s, border-color .15s, opacity .15s; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
  .card:hover { box-shadow: 0 2px 10px rgb(0 0 0 / .08); }
  .card .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
  .card.d0 .t { font-size: 16px; }
  .card .p { font: 11px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { font-size: 12px; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { position: absolute; top: 9px; right: 10px; font: 11px var(--mono); color: var(--muted); }
  .card .chips { display: flex; gap: 4px; margin-top: 6px; overflow: hidden; }
  .chip { font-size: 11px; white-space: nowrap; border-radius: 99px; padding: 0 8px; line-height: 19px; border: 1px solid var(--line); color: var(--muted); background: var(--bg); }
  .chip b { color: var(--cc); font-weight: 500; }
  .chip:hover { border-color: var(--cc); }
  .tag { font: 10px/16px var(--mono); text-transform: uppercase; letter-spacing: .06em; border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; border: 1px dashed currentColor; color: var(--muted); }
  .card.draft { border-style: dashed; border-color: var(--muted); }
  .card.obsolete { opacity: .45; filter: grayscale(1); }
  .card.sel { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel); }
  .card.isdep { box-shadow: 0 0 0 2px var(--dep); }
  .card.isdependent { box-shadow: 0 0 0 2px var(--dependent); }
  body.focus .card:not(.sel):not(.isdep):not(.isdependent):not(.anc) { opacity: .35; }
  .tog { position: absolute; width: 20px; height: 20px; border-radius: 50%; padding: 0; font: 13px/18px var(--mono); text-align: center; z-index: 1; }

  aside { width: 320px; flex: none; border-left: 1px solid var(--line); background: var(--panel); padding: 18px 20px; overflow: auto; }
  aside h2 { font-size: 18px; margin: 0 0 2px; text-wrap: balance; }
  aside .p { font: 12px var(--mono); color: var(--muted); }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; font-weight: 500; }
  aside ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
  aside li button { border: 0; padding: 0; background: none; text-align: left; }
  aside li button:hover { text-decoration: underline; }
  .k-dep { color: var(--dep); } .k-dependent { color: var(--dependent); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); }
  @media (max-width: 760px) { main { flex-direction: column; } aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>A · Branches <span>— refined left-to-right tree</span></h1>
  <nav aria-label="Proposals"><a href="index.html">All</a><a href="a-branches.html" aria-current="page">A</a><a href="b-orbits.html">B</a><a href="c-floorplan.html">C</a></nav>
  <span class="sp"></span>
  <label for="ds">Data</label><select id="ds"></select>
</header>
<main>
  <div id="stage">
    <div class="zoom"><button id="zo" title="Zoom out">−</button><button id="zi" title="Zoom in">+</button><button id="zf" title="Fit the whole map">Fit</button></div>
    <div id="canvas"></div>
  </div>
  <aside id="card"></aside>
</main>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const W = 236, COL = 300, GAP = 12, PAD = 24;
let T, sel = null, zoom = 1;
const collapsed = new Set();
const color = n => n.depth === 0 ? 'var(--fg)' : `var(--b${n.branch % 8})`;
const height = n => (n.depth === 0 ? 92 : n.depth === 1 ? 82 : 52) + (n.depNodes.length ? 26 : 0);

for (const [k, v] of Object.entries(MAP_DATA)) $('ds').add(new Option(v.label, k));
$('ds').onchange = () => load($('ds').value);

function load(key) {
  T = buildTree(MAP_DATA[key].nodes); sel = T.root; collapsed.clear(); render(); fit();
}

function layout() {
  const items = [];
  const block = n => {
    const kids = collapsed.has(n.path) ? [] : n.children;
    const kh = kids.reduce((s, c) => s + block(c), 0) + Math.max(0, kids.length - 1) * GAP;
    n._kids = kids; n._h = height(n); n._block = Math.max(n._h, kh); n._kh = kh;
    return n._block;
  };
  const place = (n, top) => {
    n._x = PAD + n.depth * COL; n._y = top + (n._block - n._h) / 2; items.push(n);
    let y = top + (n._block - n._kh) / 2;
    for (const c of n._kids) { place(c, y); y += c._block + GAP; }
  };
  block(T.root); place(T.root, PAD);
  return items;
}

function render() {
  const items = layout();
  const maxX = Math.max(...items.map(n => n._x)) + W + PAD + 20, maxY = T.root._block + 2 * PAD;
  const anc = new Set(); for (let p = sel; p; p = p.parent) anc.add(p);
  const depSet = new Set(sel.depNodes), dependentSet = new Set(sel.dependents);
  let svg = `<svg width="${maxX}" height="${maxY}">`, html = '';
  for (const n of items) for (const c of n._kids) {
    const x1 = n._x + W, y1 = n._y + n._h / 2, x2 = c._x, y2 = c._y + c._h / 2, m = (x2 - x1) * .55;
    const on = anc.has(c) || c.parent === sel;
    svg += `<path class="link${on ? ' on' : ''}" stroke="${color(c)}" stroke-width="${on ? 3.5 : Math.max(1.5, 3.2 - c.depth * .5)}" d="M${x1} ${y1}C${x1 + m} ${y1} ${x2 - m} ${y2} ${x2} ${y2}"/>`;
  }
  svg += '</svg>';
  for (const n of items) {
    const cls = ['card', 'd' + n.depth, n === sel && 'sel', depSet.has(n) && 'isdep', dependentSet.has(n) && 'isdependent', anc.has(n) && 'anc',
      n.status === 'draft' && 'draft', n.inObsolete && 'obsolete'].filter(Boolean).join(' ');
    html += `<div class="${cls}" data-p="${esc(n.path)}" tabindex="0" style="left:${n._x}px;top:${n._y}px;width:${W}px;height:${n._h}px;--c:${color(n)}" title="${esc(n.summary)}">
      <div class="t">${esc(n.title)}${n.status !== 'stable' ? `<span class="tag">${n.status}</span>` : ''}</div>
      <div class="p">${esc(n.path || 'docs/')}</div>
      ${n.depth <= 1 ? `<div class="s">${esc(n.summary)}</div>` : ''}
      <div class="meta" title="Decisions">${n.decisions}◆</div>
      ${n.depNodes.length ? `<div class="chips">${n.depNodes.map(d => `<span class="chip" data-p="${esc(d.path)}" style="--cc:${color(d)}" title="Depends on ${esc(d.title)}: click to jump"><b>↗</b> ${esc(d.title)}</span>`).join('')}</div>` : ''}
    </div>`;
    if (n.children.length) html += `<button class="tog" data-t="${esc(n.path)}" style="left:${n._x + W - 10}px;top:${n._y + n._h / 2 - 10}px" title="${collapsed.has(n.path) ? 'Expand' : 'Collapse'}">${collapsed.has(n.path) ? '+' : '−'}</button>`;
  }
  $('canvas').innerHTML = svg + html;
  $('canvas').style.width = maxX + 'px'; $('canvas').style.height = maxY + 'px'; $('canvas').style.zoom = zoom;
  document.body.classList.toggle('focus', sel !== T.root);
  renderCard();
}

function renderCard() {
  const n = sel, list = (arr, k) => arr.length ? `<ul>${arr.map(d => `<li><button class="${k}" data-p="${esc(d.path)}">${esc(d.title)}</button></li>`).join('')}</ul>` : '<div class="p">None</div>';
  const areas = T.root.children.map(a => `<span style="--c:${color(a)}"><i></i>${esc(a.title)}</span>`).join('');
  $('card').innerHTML = `<h2>${esc(n.title)}</h2><div class="p">${esc(n.path || 'docs/')} · ${n.status} · ${n.decisions} decisions</div>
    <h3>Summary</h3><div>${esc(n.summary)}</div>
    <h3>Depends on</h3>${list(n.depNodes, 'k-dep')}
    <h3>Used by</h3>${list(n.dependents, 'k-dependent')}
    <h3>Areas</h3><div class="legend">${areas}</div>
    <h3>How to read it</h3><div class="p" style="font-family:var(--sans)">Each top-level area has its own colour, carried by its connectors. ◆ counts decisions. Chips are dependencies: click one to jump. Selecting a node rings what it depends on in green and what uses it in amber.</div>`;
}

function select(path) {
  sel = T.byPath.get(path); render();
  const el = document.querySelector(`.card[data-p="${CSS.escape(path)}"]`);
  if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]'); if (t) { const p = t.dataset.t; collapsed.has(p) ? collapsed.delete(p) : collapsed.add(p); render(); return; }
  const c = e.target.closest('[data-p]'); if (c) { e.stopPropagation(); select(c.dataset.p); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.card')) select(e.target.dataset.p); });
const setZoom = z => { zoom = Math.min(1.6, Math.max(.3, z)); $('canvas').style.zoom = zoom; };
$('zi').onclick = () => setZoom(zoom * 1.2);
$('zo').onclick = () => setZoom(zoom / 1.2);
function fit() { const s = $('stage'), c = $('canvas'); const zw = (s.clientWidth - 20) / parseFloat(c.style.width), zh = (s.clientHeight - 50) / parseFloat(c.style.height); setZoom(Math.min(1, zw, Math.max(zh, .75))); }
$('zf').onclick = fit;
load('project');
</script>
</body>
</html>
